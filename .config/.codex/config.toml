model = "gpt-6.1-sol"
model_provider = "headroom"
model_reasoning_effort = "medium"
openai_base_url = "http://127.0.0.1:8787/v1"
service_tier = "default"

[mcp_servers.codegraph]
args = ["serve", "--mcp"]
command = "codegraph"
default_tools_approval_mode = "approve"

[mcp_servers.fff]
command = "fff-mcp"
default_tools_approval_mode = "approve"

[mcp_servers.headroom]
args = ["mcp", "serve"]
command = "headroom"
default_tools_approval_mode = "approve"

[mcp_servers.inspect]
command = "inspect-mcp"
default_tools_approval_mode = "approve"

[mcp_servers.linear]
default_tools_approval_mode = "approve"
url = "https://mcp.linear.app/mcp"

[mcp_servers.sem]
command = "sem-mcp"
default_tools_approval_mode = "approve"

[mcp_servers.tokensave]
args = ["serve"]
command = "tokensave"
default_tools_approval_mode = "approve"

[mcp_servers.serena]
command = "serena"
args = [
  "start-mcp-server",
  "--project-from-cwd",
  "--context",
  "codex",
  "--open-web-dashboard",
  "False",
]
default_tools_approval_mode = "approve"


[model_providers.headroom]
base_url = "http://127.0.0.1:8787/v1"
name = "OpenAI via Headroom proxy"
requires_openai_auth = true
supports_websockets = true

[model_providers.headroom.env_http_headers]
X-Headroom-Project = "HEADROOM_PROJECT"

[projects."/Users/nikitabarskov/gh/infra"]
trust_level = "trusted"

[projects."/Users/nikitabarskov/gh/surgery-planning"]
trust_level = "trusted"

[projects."/Users/nikitabarskov/personal/dotfiles"]
trust_level = "trusted"

[projects."/Users/nikitabarskov/personal/hirn.studio/apis"]
trust_level = "trusted"

[projects."/Users/nikitabarskov/personal/hirn.studio/backend"]
trust_level = "trusted"

[projects."/Users/nikitabarskov/personal/hirn.studio/platform"]
trust_level = "trusted"

[projects."/Users/nikitabarskov/personal/hirn.studio/sowai"]
trust_level = "trusted"

[projects."/home/nikitabarskov/personal/dotfiles"]
trust_level = "trusted"

[projects."/home/nikitabarskov/personal/hirn.studio/apis"]
trust_level = "trusted"

[projects."/home/nikitabarskov/personal/hirn.studio/backend"]
trust_level = "trusted"

